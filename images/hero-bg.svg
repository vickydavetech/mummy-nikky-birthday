<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B2C2A"/>
      <stop offset="0.48" stop-color="#6E4442"/>
      <stop offset="1" stop-color="#2B1B1D"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(286 244) rotate(52.2895) scale(572.729 588.655)">
      <stop stop-color="#EBD1C6" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#EBD1C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1258 699) rotate(115.915) scale(514.84 480.653)">
      <stop stop-color="#D4A99F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#D4A99F" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="293" cy="232" rx="420" ry="420" fill="url(#glow1)"/>
  <ellipse cx="1229" cy="673" rx="430" ry="400" fill="url(#glow2)"/>

  <g opacity="0.18" stroke="#F5E8D7" stroke-width="1.2">
    <circle cx="800" cy="450" r="360"/>
    <circle cx="800" cy="450" r="440"/>
  </g>

  <g opacity="0.5" fill="#F5E8D7">
    <circle cx="164" cy="252" r="3"/>
    <circle cx="483" cy="120" r="2.5"/>
    <circle cx="1042" cy="168" r="3"/>
    <circle cx="1362" cy="316" r="2.8"/>
    <circle cx="1307" cy="802" r="3"/>
    <circle cx="222" cy="698" r="2.7"/>
    <circle cx="714" cy="140" r="2.2"/>
    <circle cx="570" cy="740" r="2.6"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.7"/>
</svg>
